  <div id="root"></div>
  
  <script src="webxdc.js"></script>
<script>/* ChatVote: replayable webxdc operations. No network or localStorage required. */
(function () {
  'use strict';
  const demo = !window.webxdc;
  const api = window.webxdc || {selfAddr:'preview',selfName:'あなた（デモ）',sendUpdateInterval:0,sendUpdateMaxSize:128000,sendUpdate:update=>receive(update),setUpdateListener:()=>Promise.resolve()};
  const events = new Map(), subscribers = new Set();
  const transfers = new Map();
  const APP_VERSION = "1.3.0", MAX_FILE = 10 * 1024 * 1024, MAX_EVENTS = 20000;
  let restoring = false;
  let clock = 0, lastSend = -Infinity;
  let state = { proposals: [], votes: [], ready: false, adminMode:false, selfActor:api.selfAddr, identities:[], version:APP_VERSION, status: api ? '履歴を同期中' : 'Delta Chatで開いてください' };
  const text = x => typeof x === 'string';
  const order = (a,b) => a.seq-b.seq || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
  function publish() { subscribers.forEach(fn => fn(state)); }
  function valid(e) {
    if (!e || e.app !== 'chatvote-1' || !text(e.id) || !e.id || !text(e.actor) || !e.actor || !Number.isSafeInteger(e.seq) || e.seq < 1 || !Number.isFinite(e.time) || !text(e.name)) return false;
    if (!e.data || typeof e.data !== 'object') return false;
    if (e.type === 'identity') return text(e.data.target) && !!e.data.target;
    if (!['create','vote','status','delete','moderate'].includes(e.type) || !text(e.data.proposalId) || !e.data.proposalId) return false;
    if(e.type==='moderate')return ['closed','open','delete'].includes(e.data.action);
    if (e.type === 'create' && (!text(e.data.title) || !e.data.title.trim() || !text(e.data.purpose) || !text(e.data.detail) || (e.data.deadline != null && !Number.isFinite(e.data.deadline)))) return false;
    if (e.type === 'vote' && (!['agree','disagree','hold'].includes(e.data.choice) || !text(e.data.opinion))) return false;
    if (e.type === 'status' && !['open','closed','cancelled'].includes(e.data.status)) return false;
    return true;
  }
  function rebuild() {
    const proposals = new Map(), votes = new Map(), deleted = new Set();
    const sorted=[...events.values()].sort(order), aliases=new Map();
    function canonical(actor){const seen=new Set();while(aliases.has(actor)&&!seen.has(actor)){seen.add(actor);actor=aliases.get(actor);}return actor;}
    const known=new Set(sorted.filter(e=>e.type==='create'||e.type==='vote').map(e=>e.actor));
    for(const e of sorted) if(e.type==='identity' && known.has(e.data.target)) {
      const target=canonical(e.data.target);
      if(target!==e.actor) aliases.set(e.actor,target);
    }
    const identities=new Map();
    for (const source of sorted) {
      if(source.type==='identity')continue;
      const op={...source,actor:canonical(source.actor)};
      if(op.type==='create'||op.type==='vote')identities.set(op.actor,op.name);
      const d = op.data, id = d.proposalId;
      if (deleted.has(id)) continue;
      if (op.type === 'create') {
        if (!proposals.has(id)) proposals.set(id,{id,title:d.title,purpose:d.purpose,detail:d.detail,deadline:d.deadline || undefined,createdByAddr:op.actor,createdByName:op.name,createdAt:op.time,status:'open'});
        continue;
      }
      const p = proposals.get(id);
      if (!p) continue;
      // Administrative commands are a shared operation type, separate from
      // creator commands. The UI password is a local lock, not authentication.
      if(op.type==='moderate'){
        if(d.action==='delete'){proposals.delete(id);deleted.add(id);}
        else if(p.status!=='cancelled'){p.status=d.action;p.managedByName=op.name;p.managedAt=op.time;}
        continue;
      }
      if (op.type === 'vote' && p.status === 'open' && (!p.deadline || op.time <= p.deadline)) votes.set(JSON.stringify([id,op.actor]),{proposalId:id,voterAddr:op.actor,voterName:op.name,choice:d.choice,opinion:d.opinion,timestamp:op.time});
      if (op.actor === p.createdByAddr) {
        if (op.type === 'status' && p.status !== 'cancelled') p.status = d.status;
        if (op.type === 'delete') { proposals.delete(id); deleted.add(id); }
      }
    }
    state = {...state,selfActor:canonical(api.selfAddr),identities:[...identities].map(([id,name])=>({id,name})),proposals:[...proposals.values()].reverse(),votes:[...votes.values()].filter(v=>proposals.has(v.proposalId)),status:demo?'デモ表示・通信なし':'更新を反映しました'};
    publish();
  }
  function merge(list) {
    const checked=new Map();
    for(const e of list){const prev=checked.get(e.id)||events.get(e.id);if(prev && JSON.stringify(prev)!==JSON.stringify(e))throw Error('同じ更新IDに異なる内容があります。取り込みを中止しました');checked.set(e.id,e);}
    for(const e of list){events.set(e.id,e);clock=Math.max(clock,e.seq);}
    rebuild();
  }
  function receive(update) {
    const e=update.payload;
    if(e && e.app==='chatvote-transfer-1'){
      if(!text(e.id)||!Number.isSafeInteger(e.total)||e.total<1||e.total>1000||!Number.isSafeInteger(e.index)||e.index<0||e.index>=e.total||!Array.isArray(e.events)||!e.events.every(valid))return;
      let t=transfers.get(e.id);
      if(!t){if(transfers.size>=20){for(const [key,value] of transfers)if(value.done){transfers.delete(key);break;}}if(transfers.size>=20)return;t={total:e.total,chunks:new Map(),done:false};transfers.set(e.id,t);}
      if(t.total!==e.total||t.done)return;
      const previous=t.chunks.get(e.index);
      if(previous && JSON.stringify(previous)!==JSON.stringify(e.events))return;
      t.chunks.set(e.index,e.events);
      const count=[...t.chunks.values()].reduce((n,x)=>n+x.length,0);
      if(count>MAX_EVENTS||new TextEncoder().encode(JSON.stringify([...t.chunks.values()])).length>MAX_FILE){transfers.delete(e.id);return;}
      state={...state,migration:{id:e.id,received:t.chunks.size,total:t.total,complete:false},status:`引継ぎデータ受信中 ${t.chunks.size}/${t.total}`};
      if(t.chunks.size===t.total){
        const all=[];for(let i=0;i<t.total;i++)all.push(...t.chunks.get(i));
        try{merge(all);t.done=true;t.chunks.clear();state={...state,migration:{id:e.id,received:t.total,total:t.total,complete:true},status:'引継ぎデータを反映しました'};}
        catch(err){state={...state,status:err.message};}
      }
      publish();return;
    }
    if(!valid(e)||events.has(e.id))return;
    merge([e]);
  }
  async function start() {
    if (!api) return;
    try { await api.setUpdateListener(receive,0); state={...state,ready:true,status:demo?'デモ表示・通信なし':'webxdc 同期準備完了'}; }
    catch (_) { state={...state,status:'履歴の読込に失敗しました。開き直してください'}; }
    publish();
  }
  function send(type,data) {
    if (!state.ready) throw Error(state.status);
    if(restoring)throw Error('引継ぎデータの送信中です。完了までお待ちください');
    if(state.migration && !state.migration.complete)throw Error('引継ぎデータを受信中です。完了までお待ちください');
    const interval = demo ? 0 : Number(api.sendUpdateInterval) || 10000;
    const wait = interval - (Date.now()-lastSend);
    if (wait > 0) throw Error(`連続送信を避けるため、${Math.ceil(wait/1000)}秒後に再操作してください`);
    const p = state.proposals.find(p=>p.id===data.proposalId);
    if (!['create','identity'].includes(type) && !p) throw Error('議題が見つかりません');
    if (type === 'vote' && (p.status !== 'open' || (p.deadline && Date.now()>p.deadline))) throw Error('この投票は締め切られています');
    if(type==='moderate' && !state.adminMode)throw Error('管理モードに切り替えてから操作してください');
    if(type==='moderate' && data.action!=='delete' && p.status==='cancelled')throw Error('キャンセル済みの議題は再開・締切できません。削除は可能です');
    if (['status','delete'].includes(type) && p.createdByAddr !== state.selfActor) throw Error('議題の作成者だけが操作できます');
    if (type === 'status' && p.status === 'cancelled') throw Error('キャンセル済みの議題は再開できません。新しい議題を作成してください');
    const payload={app:'chatvote-1',id:crypto.randomUUID(),seq:++clock,actor:api.selfAddr,name:api.selfName || '参加者',time:Date.now(),type,data};
    const update={payload};
    if(!valid(payload))throw Error('入力データの形式を確認してください');
    if (new TextEncoder().encode(JSON.stringify(update)).length > (api.sendUpdateMaxSize || 128000)) throw Error('入力内容が長すぎます。短くしてください');
    api.sendUpdate(update,''); lastSend=Date.now();
    return payload;
  }
  function backup(){
    if(!state.ready)throw Error('履歴の読み込み完了後に操作してください');
    if(state.migration && !state.migration.complete)throw Error('引継ぎ受信中です。完了してから書き出してください');
    if(!events.size)throw Error('書き出す投票データがありません');
    const result=JSON.stringify({format:'chatvote-backup',schemaVersion:1,appVersion:APP_VERSION,demo,exportedAt:new Date().toISOString(),events:[...events.values()].sort(order)},null,2);
    if(events.size>MAX_EVENTS||new TextEncoder().encode(result).length>MAX_FILE)throw Error('引継ぎ上限を超えています。配布担当者へご相談ください');
    return result;
  }
  function snapshotEvents(snapshot){
    if(!snapshot||!Array.isArray(snapshot.proposals)||!Array.isArray(snapshot.votes))throw Error('旧版データの形式が違います');
    const out=[],ids=new Set();let seq=0;
    const event=(p,type,data,id,time,actor,name)=>({app:'chatvote-1',id,seq:++seq,actor:actor||p.createdByAddr,name:name||p.createdByName,time:time??p.createdAt,type,data});
    for(const p of snapshot.proposals){
      if(!p||!text(p.id)||ids.has(p.id)||!['open','closed','cancelled'].includes(p.status))throw Error('旧版の議題データが不正です');
      ids.add(p.id);
      out.push(event(p,'create',{proposalId:p.id,title:p.title,purpose:p.purpose,detail:p.detail,deadline:p.deadline??null},'legacy-create-'+p.id));
      const voters=new Set();
      for(const v of snapshot.votes.filter(v=>v.proposalId===p.id)){
        if(voters.has(v.voterAddr))throw Error('旧版データに同じ利用者の重複票があります');voters.add(v.voterAddr);
        out.push(event(p,'vote',{proposalId:p.id,choice:v.choice,opinion:v.opinion},'legacy-vote-'+JSON.stringify([p.id,v.voterAddr,v.timestamp,v.choice,v.opinion]),v.timestamp,v.voterAddr,v.voterName));
      }
      if(p.status!=='open')out.push(event(p,'status',{proposalId:p.id,status:p.status},'legacy-status-'+JSON.stringify([p.id,p.status])));
    }
    if(snapshot.votes.some(v=>!ids.has(v.proposalId)))throw Error('対象の議題がない投票があります');
    return out;
  }
  function prepareBackup(input){
    if(!text(input)||new TextEncoder().encode(input).length>MAX_FILE)throw Error('ファイルは10MB以内にしてください');
    let b;try{b=JSON.parse(input.replace(/^\uFEFF/,''));}catch(_){throw Error('JSON形式の引継ぎファイルを選択してください');}
    let list;
    if(Array.isArray(b))list=b.map(x=>x.payload||x);
    else if(b && b.format==='chatvote-backup' && b.schemaVersion===1)list=b.events;
    else if(b && b.format==='chatvote-legacy-snapshot' && b.schemaVersion===1)list=snapshotEvents(b.snapshot);
    else throw Error('対応していないバックアップ形式・データ版です');
    if(!demo && b.demo)throw Error('デモデータを実際の投票へ引き継ぐことはできません');
    if(!Array.isArray(list)||!list.length||list.length>MAX_EVENTS||!list.every(valid))throw Error('バックアップの更新データが不正、空、または件数上限を超えています');
    const unique=new Map();
    for(const e of list){const prev=unique.get(e.id)||events.get(e.id);if(prev && JSON.stringify(prev)!==JSON.stringify(e))throw Error('更新IDの内容が一致しません');unique.set(e.id,e);}
    const normalized=[...unique.values()].sort(order);
    return {events:normalized,updates:normalized.length,proposals:new Set(normalized.filter(e=>e.type==='create').map(e=>e.data.proposalId)).size,votes:normalized.filter(e=>e.type==='vote').length,sourceVersion:b.appVersion||'旧版'};
  }
  async function restore(input,onProgress=()=>{}){
    if(!state.ready)throw Error('履歴の読み込み完了後に操作してください');
    if(restoring)throw Error('引継ぎ処理が進行中です');
    const plan=prepareBackup(input),id=crypto.randomUUID(),limit=Math.min(Number(api.sendUpdateMaxSize)||128000,128000);
    const chunks=[];let part=[];
    for(const e of plan.events){
      const candidate=[...part,e];
      const test={payload:{app:'chatvote-transfer-1',id,index:999,total:1000,events:candidate}};
      if(new TextEncoder().encode(JSON.stringify(test)).length>limit){if(!part.length)throw Error('1件のデータが通信サイズ上限を超えています');chunks.push(part);part=[e];if(new TextEncoder().encode(JSON.stringify({...test,payload:{...test.payload,events:part}})).length>limit)throw Error('1件のデータが通信サイズ上限を超えています');}
      else part=candidate;
    }
    if(part.length)chunks.push(part);
    if(chunks.length>1000)throw Error('引継ぎデータの分割数が多すぎます');
    restoring=true;
    try{
      for(let i=0;i<chunks.length;i++){
        const interval=demo?0:Number(api.sendUpdateInterval)||10000,wait=interval-(Date.now()-lastSend);
        if(wait>0)await new Promise(resolve=>setTimeout(resolve,wait));
        api.sendUpdate({payload:{app:'chatvote-transfer-1',id,index:i,total:chunks.length,events:chunks[i]}},'');lastSend=Date.now();onProgress(i+1,chunks.length);
      }
      return {id,chunks:chunks.length};
    }finally{restoring=false;}
  }
  function linkIdentity(target){if(!state.identities.some(x=>x.id===target))throw Error('以前の利用者を選択してください');return send('identity',{target});}
  function setAdminMode(enabled){state={...state,adminMode:enabled===true};publish();}
  window.ChatVote={demo,version:APP_VERSION,get:()=>state,subscribe(fn){subscribers.add(fn);return()=>subscribers.delete(fn);},send,start,backup,prepareBackup,restore,linkIdentity,setAdminMode};
  if(demo){
    const time=Date.now();
    receive({payload:{app:'chatvote-1',id:'demo-create',seq:1,actor:'preview',name:'あなた（デモ）',time,type:'create',data:{proposalId:'demo-poll',title:'次回のミーティングをオンラインで開催しませんか？',purpose:'投票の動作を試すためのデモ議題です。賛成・反対・保留を選んで投票できます。',detail:'この画面の操作は他の端末へ送信されません。再読み込みすると初期状態に戻ります。',deadline:null}}});
    ['agree','disagree','hold'].forEach((choice,i)=>receive({payload:{app:'chatvote-1',id:'demo-vote-'+i,seq:i+2,actor:'demo-'+i,name:['佐藤（デモ）','田中（デモ）','鈴木（デモ）'][i],time:time+i,type:'vote',data:{proposalId:'demo-poll',choice,opinion:['移動時間を減らせるので賛成です。','対面で相談したいです。','開催時間が決まってから判断したいです。'][i]}}}));
  }
  start();
})();
</script>
<script>/* File-based migration. No data leaves this app until the user chooses a button. */
(function(){
 'use strict';
 window.ChatVote.mountTransfer=function(el){
  if(!el || el.dataset.mounted)return;el.dataset.mounted='true';
  const app=window.ChatVote;
  el.className='chatvote-transfer';
  el.innerHTML='<details><summary>データ引継ぎ・バックアップ <small></small></summary><p>新版へ移す前に旧版の投票を止め、全員の反映を確認してください。代表者1人が書き出し、新版で読み込むと参加者にも共有されます。</p><div class="transfer-actions"><button type="button" data-action="export">データを書き出す</button><button type="button" data-action="import">データを読み込む</button></div><input type="file" accept=".json,application/json" hidden><div class="transfer-preview" hidden><p></p><p>議題・票・意見・締切状態を既存データに追加統合します。個人名と意見を含みます。信頼できるバックアップだけを読み込んでください。</p><button type="button" data-action="confirm">読み込んで参加者と共有する</button> <button type="button" data-action="cancel">やめる</button></div><p role="status" aria-live="polite" class="transfer-status"></p><label>新版で投票変更や議題管理を続ける方へ<br>以前の自分の記録 <select aria-label="以前の自分の記録"></select></label> <button type="button" data-action="identity">自分の記録を引き継ぐ</button><p>同じ名前でも別人の場合があります。必ず自分の記録を選択してください。この設定は自己申告で、本人認証ではありません。自分の過去データがなければ選択不要です。</p><p>旧版に書き出しボタンがない場合は、配布資料の「データ引継ぎ手順」を参照してください。別の添付アプリの履歴を自動で読むことはできません。</p></details>';
  el.querySelector('small').textContent='v'+app.version;
  const status=el.querySelector('.transfer-status'),preview=el.querySelector('.transfer-preview'),select=el.querySelector('select'),fileInput=el.querySelector('input');
  let pending=null,busy=false,keys='';
  const say=s=>status.textContent=s;
  function update(s){
   for(const b of el.querySelectorAll('button'))b.disabled=!s.ready||busy;
   const next=JSON.stringify(s.identities);
   if(next!==keys){const previous=select.value;select.replaceChildren();const blank=document.createElement('option');blank.value='';blank.textContent='選択してください';select.append(blank);s.identities.forEach((person,i)=>{const option=document.createElement('option');option.value=person.id;option.textContent=person.name+'（記録 '+(i+1)+'）';select.append(option);});select.value=[...select.options].some(o=>o.value===previous)?previous:'';keys=next;}
   if(s.migration){if(s.migration.complete)say('引継ぎデータがこの端末に反映されました。相手端末でも件数を確認してください。');else say('引継ぎデータを受信中 '+s.migration.received+'/'+s.migration.total+'。未完了の場合は同じファイルを再度読み込んでください。');}
  }
  update(app.get());app.subscribe(update);
  async function choose(file){
   if(!file)return;
   try{if(file.size>10*1024*1024)throw Error('ファイルは10MB以内にしてください');pending=await file.text();const p=app.prepareBackup(pending);preview.querySelector('p').textContent='読み込み元 '+p.sourceVersion+' ／ 議題履歴 '+p.proposals+'件 ／ 投票履歴 '+p.votes+'件 ／ 更新 '+p.updates+'件。投票履歴には変更前の票も含むため、現在の総投票数とは異なります。';preview.hidden=false;say('内容を確認してから読み込んでください。');}catch(e){pending=null;preview.hidden=true;say(e.message);}
  }
  fileInput.addEventListener('change',async()=>{await choose(fileInput.files[0]);fileInput.value='';});
  el.querySelector('[data-action="import"]').onclick=async()=>{
   try{if(window.webxdc?.importFiles){const files=await window.webxdc.importFiles({extensions:['.json'],mimeTypes:['application/json'],multiple:false});await choose(files[0]);}else fileInput.click();}catch(e){say('ファイルを選択できませんでした。'+e.message);}
  };
  el.querySelector('[data-action="export"]').onclick=async()=>{
   try{
    const content=app.backup(),name='ChatVote-backup-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';
    if(window.webxdc?.sendToChat){await window.webxdc.sendToChat({file:{name,plainText:content},text:'ChatVoteの引継ぎ用バックアップです。個人名・投票・意見を含みます。'});say('添付の下書きを準備しました。送信・保存を完了してください。');}
    else{const blob=new Blob([content],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);say('バックアップの保存を開始しました。保存先を確認してください。');}
   }catch(e){say('書き出しできませんでした。'+e.message);}
  };
  el.querySelector('[data-action="confirm"]').onclick=async()=>{
   if(!pending||busy)return;
   busy=true;update(app.get());
   try{const result=await app.restore(pending,(n,total)=>say('引継ぎ送信依頼 '+n+'/'+total+'。完了までこの画面を開いたままにしてください。'));pending=null;preview.hidden=true;if(app.get().migration?.id===result.id&&app.get().migration.complete)say('引継ぎデータを反映しました。相手端末の件数も確認してください。');else say('送信を依頼しました。まだ読込完了ではありません。受信後の件数を確認してください。');}
   catch(e){say('引継ぎが完了しませんでした。'+e.message+' 同じファイルを再度読み込めます。');}
   finally{busy=false;updateButtons();}
  };
  function updateButtons(){for(const b of el.querySelectorAll('button'))b.disabled=!app.get().ready||busy;}
  el.querySelector('[data-action="cancel"]').onclick=()=>{pending=null;preview.hidden=true;say('読み込みをやめました。');};
  el.querySelector('[data-action="identity"]').onclick=()=>{
   if(!select.value){say('以前の自分の記録を選択してください。');return;}
   if(!confirm('選択した記録は以前のあなた自身のものですか？\n新しい投票を追加せず、以前の票を変更するための設定です。本人認証ではありません。'))return;
